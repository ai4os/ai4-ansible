# -- Ansible
ansible_master: { name: ansible-master, ip: 172.16.44.31 } #Change to your ansible master IP

# -- Security
#########################################################
########## WARNING: DO NOT SET THIS VARIABLE ############
from_scratch_cluster_installation: true
#########################################################  

# -- Admin
add_new_nodes: true



# -- General
username: ubuntu
path: "/home/ubuntu/"
path_system: /etc/systemd/system/
path_bin: /usr/bin/

# -- Common
consul_public_ip: "193.146.75.106"                              #Add datacenter publics IP
consul_servers_ip: !unsafe ["193.146.75.205", "193.146.75.229", "193.146.75.143", "193.146.75.106"]                   #Add cluster servers IPs. Unsafe option avoids replacing double quotes with single quotes
my_ip: "{{ ansible_host}}"
environment_file: /etc/environment
hosts: /etc/hosts
new_certs: "ifca-imagine-federation-certificates"
primary_datacenter: "ifca-ai4eosc"

# -- Alloy / Loki logs
alloy_enabled: false
alloy_loki_url: "https://loki.cloud.ai4eosc.eu/loki/api/v1/push"
alloy_loki_user: "alloy"
alloy_loki_password: ''
alloy_loki_tenant_id: "default"

# -- Volumes-docker
disks_path: /dev/
mount_dir: /mnt/data
docker_config: /etc/docker/
docker_registry: https://repo.ifca.es:5000
grub_path: /etc/default/grub

# -- Traefik
traefik_certs_dir: /etc/nomad.d/traefik-certs
traefik_certs: ifca-deployments.cloud.ai4eosc.eu #Change to your certs folder name
traefik_letsencrypt_email: admin@test.com

# -- Nomad
nomad_version: 1.11.3
nomad_data_dir: /opt/nomad
nomad: "{{ path_bin }}nomad"
nomad_config_dir: /etc/nomad.d
nomad_config: "{{ nomad_config_dir }}/"
nomad_certs_dir: "{{ nomad_config_dir }}/certs"
nomad_certs: "{{ nomad_certs_dir }}/"
nomad_fetched_dir: "{{ path }}{{consul_dc_name}}/nomad_fetched"
nomad_fetched: "{{ nomad_fetched_dir }}/"
nomad_ui_passwd: 1234
nomad_namespaces:
  - ai4eosc
  - imagine
  - tutorials
  - ai4life
nomad_nvidia_plugin_version: 1.0.0
gpu_plugin_dir: plugins
nomad_reserved_memory_mb: 4096
nomad_username: nomad
nomad_cni_version: 1.0.0
nomad_region: ai4os
nomad_client_meta: { "status": "test" }
docker_nvidia_driver_version: 550

# -- Consul
consul_version: 1.21.1
consul_data_dir: /opt/consul
consul: "{{ path_bin }}consul"
consul_config_dir: /etc/consul.d
consul_config: "{{ consul_config_dir }}/"
consul_certs_dir: "{{ consul_config_dir }}/certs"
consul_certs: "{{ consul_certs_dir }}/"
consul_fetched_dir: "{{ path }}{{consul_dc_name}}/consul_fetched"
consul_fetched: "{{ consul_fetched_dir }}/"
consul_dc_name: ifca-imagine                                      #Change to DC name
consul_policies_dir: "{{ consul_config }}policies"
consul_policies: "{{ consul_policies_dir }}/"
consul_username: consul

# -- DCGM Exporter (GPU power monitoring)
dcgm_exporter_enabled: false
dcgm_exporter_version: "4.5.3-4.8.2-distroless"

# -- GPU allocation mapper (maps GPU UUID -> Nomad alloc_id via docker inspect,
# for joining with DCGM_FI_DEV_* metrics in PromQL: on(UUID) group_left(alloc_id))
gpu_alloc_mapper_enabled: false
gpu_alloc_mapper_script_path: /opt/nomad-scripts/nomad_gpu_alloc_mapper.py

# -- Scaphandre Agent (CPU power monitoring)
scaphandre_enabled: false

# -- Alloy metrics sidecar (push mode: scrape local exporter, remote_write to Mimir)
# Independent of alloy_enabled (Alloy/Loki logs above) -- that flag only controls
# whether the roles/alloy role runs, which is where alloy_image would otherwise
# come from as a role default. Set it here too so the metrics sidecar doesn't
# silently depend on the logs role having been enabled on the same host.
alloy_image: "grafana/alloy:latest"
# Tenant (X-Scope-OrgID) is derived server-side from the authenticated basic-auth
# user in the Mimir gateway, so alloy_mimir_user must match this site's tenant
# name in Mimir -- kept equal to consul_dc_name so there's a single value to set
# per site instead of two that can drift out of sync.
alloy_metrics_enabled: false
alloy_mimir_url: "https://mimir.k8s.cloud.ai4eosc.eu/api/v1/push"
alloy_mimir_user: "{{ consul_dc_name }}"
alloy_mimir_password: ""
# Federation-wide standard, not a per-site tuning knob: mismatched intervals
# across sites force any shared rate()/increase() query to use the slowest
# site's interval, losing resolution for everyone else. Keep it the same
# everywhere unless changing it for the whole federation at once.
alloy_scrape_interval: "30s"
